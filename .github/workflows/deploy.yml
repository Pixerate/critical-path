name: Deploy Documentation & Marketing Site

on:
  push:
    branches: [main]

concurrency:
  group: deploy-docs-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        run: pnpm --filter @critical-path/docs build

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/977274560376/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'firebase-hosting-deployer@critical-path-7a109.iam.gserviceaccount.com'

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project critical-path-7a109
