name: Deploy Documentation & Marketing Site

on:
  push:
    branches: [main]

concurrency:
  group: deploy-docs-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase App Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        run: pnpm --filter @critical-path/docs build

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/977274560376/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'firebase-hosting-deployer@critical-path-7a109.iam.gserviceaccount.com'

      - name: Deploy to Firebase App Hosting
        run: npx --yes firebase-tools@15.33.0 apphosting:rollouts:create critical-path-web --project critical-path-7a109 --git-branch main --force
