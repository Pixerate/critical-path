name: Deploy Documentation & Marketing Site

on:
  push:
    branches: [main]

concurrency:
  group: deploy-docs-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase App Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        run: pnpm --filter @critical-path/docs build

      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/977274560376/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'firebase-hosting-deployer@critical-path-7a109.iam.gserviceaccount.com'

      - name: Deploy to Firebase App Hosting
        run: npx --yes firebase-tools@15.33.0 apphosting:rollouts:create critical-path-web --project critical-path-7a109 --git-branch main --force
