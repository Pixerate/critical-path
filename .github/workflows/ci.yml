name: CI - Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Jobs only read the repository; nothing here needs a write token.
permissions:
  contents: read

# A newer push to the same PR supersedes the running checks. Pushes to main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FIREBASE_TOOLS_VERSION: 15.33.0

jobs:
  test:
    name: Test & Build (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the changeset check can diff against the base branch
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check this PR adds a changeset
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ADDED=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- '.changeset/*.md' | grep -v '^.changeset/README.md$' || true)
          if [ -z "$ADDED" ]; then
            echo "::error title=Missing Changeset::This PR adds no changeset in .changeset/. Run 'pnpm changeset' (an empty changeset is fine for changes that publish nothing)."
            exit 1
          fi
          echo "Changesets added by this PR:"
          echo "$ADDED"

      - name: Build all workspace packages
        run: pnpm run build

      - name: Run test suite
        run: pnpm run test

  firestore-emulator:
    name: FirebaseStore conformance (Firestore emulator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Java (required by the Firestore emulator)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Run conformance suite against the Firestore emulator
        run: pnpm --filter @critical-path/core test:firestore
