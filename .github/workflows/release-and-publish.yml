name: Release & Publish Packages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish Changed Packages to NPM
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Pixerate' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for pending changesets
        id: changeset_check
        run: |
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          echo "count=$CHANGESETS" >> $GITHUB_OUTPUT
          if [ "$CHANGESETS" -gt "0" ]; then
            echo "Pending changesets found: $CHANGESETS"
          else
            echo "No pending changesets found."
          fi

      - name: Version packages & update CHANGELOG.md files
        if: steps.changeset_check.outputs.count > 0
        run: pnpm exec changeset version

      - name: Build all packages
        run: pnpm run build

      - name: Run test suite
        run: pnpm run test

      - name: Publish changed packages to NPM using OIDC Trusted Publishing
        run: |
          pnpm publish --filter @critical-path/svelte --access public --provenance --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Commit version bumps & changelogs, push git tags
        if: steps.changeset_check.outputs.count > 0
        run: |
          git add .
          git commit -m "chore(release): version packages and update changelogs [skip ci]" || echo "No changes to commit"
          git push origin HEAD --tags || echo "Failed to push tags"
