name: Release & Publish Packages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Default for every job; the publish job asks for exactly what it needs below.
permissions:
  contents: read

# Merges in quick succession must release one after another, not race to version and push.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish Changed Packages to NPM
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Pixerate' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # push the version commit and tags
      id-token: write # npm Trusted Publishing (OIDC provenance)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for pending changesets
        id: changeset_check
        run: |
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          echo "count=$CHANGESETS" >> $GITHUB_OUTPUT
          if [ "$CHANGESETS" -gt "0" ]; then
            echo "Pending changesets found: $CHANGESETS"
          else
            echo "No pending changesets found. Skipping NPM publish."
          fi

      - name: Version packages & update CHANGELOG.md files
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: pnpm exec changeset version

      - name: Build all packages
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: pnpm run build

      - name: Run test suite
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: pnpm run test

      # Push the version bump before publishing: if the push fails, nothing is published and
      # main stays in step with npm. If publishing then fails, the next run publishes the
      # versions npm does not have yet.
      - name: Commit and push version bumps & changelogs
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: |
          git add -A .changeset ':(glob)**/package.json' ':(glob)**/CHANGELOG.md'
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore(release): version packages and update changelogs [skip ci]"
            git push origin HEAD
          fi

      - name: Publish changed packages to NPM using Trusted Publishing (OIDC Provenance)
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: pnpm exec changeset publish
        env:
          # Trusted Publishing authenticates with OIDC; no npm token is stored.
          NODE_AUTH_TOKEN: ""

      - name: Push release tags
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: git push origin --tags
