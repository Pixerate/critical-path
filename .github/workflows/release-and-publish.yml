name: Release & Publish Packages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semver bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    name: Build, Version Bump & Publish to NPM
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Pixerate' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump package versions
        run: |
          BUMP="${{ inputs.bump_type || 'patch' }}"
          pnpm -r exec npm version $BUMP --no-git-tag-version
          npm version $BUMP --no-git-tag-version

      - name: Build all packages
        run: pnpm run build

      - name: Run test suite
        run: pnpm run test

      - name: Publish packages to NPM using Trusted Publishing (OIDC Provenance)
        run: pnpm --recursive publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump and push git tags
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add .
          git commit -m "chore(release): bump version to v${NEW_VERSION} [skip ci]" || echo "No changes to commit"
          git tag "v${NEW_VERSION}" || echo "Tag v${NEW_VERSION} already exists"
          git push origin HEAD --tags || echo "Failed to push tags"
