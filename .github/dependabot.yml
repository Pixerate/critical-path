version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # Starlight 0.33+ needs a newer Astro major; upgrade both together by hand.
      - dependency-name: "@astrojs/starlight"
        versions: [">=0.33.0"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Firebase App Hosting installs the docs site from its own npm lockfile, not the pnpm one.
  - package-ecosystem: "npm"
    directory: "/apps/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # Starlight 0.33+ needs a newer Astro major; upgrade both together by hand.
      - dependency-name: "@astrojs/starlight"
        versions: [">=0.33.0"]
    groups:
      docs-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # Starlight 0.33+ needs a newer Astro major; upgrade both together by hand.
      - dependency-name: "@astrojs/starlight"
        versions: [">=0.33.0"]
    groups:
      actions:
        patterns:
          - "*"
