<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="cp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Rounded Hexagon -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#0f172a" stroke="url(#cp-grad)" stroke-width="1.5" />
  <!-- Graph edges / Critical Path Highlight -->
  <path d="M10 20 L20 10 L30 20 L20 30 Z" stroke="#334155" stroke-width="2" stroke-linejoin="round" />
  <path d="M10 20 L20 10 L30 20" stroke="url(#cp-grad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  <!-- Nodes -->
  <circle cx="10" cy="20" r="3.5" fill="#38bdf8" />
  <circle cx="20" cy="10" r="3.5" fill="#818cf8" />
  <circle cx="30" cy="20" r="3.5" fill="#a855f7" />
  <circle cx="20" cy="30" r="3" fill="#475569" />
</svg>
